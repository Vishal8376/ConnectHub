# ==========================
# APPLICATION
# ==========================
spring.application.name=connecthub

# ==========================
# DATABASE CONFIGURATION
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_db
spring.datasource.username=root
spring.datasource.password=301206
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# LOGGING
# ==========================
logging.level.org.springframework.security=DEBUG

# ==========================
# JWT
# ==========================
jwt.secret=8F4B2E6D9A1C7F8E3B5D9A2C6E1F4B8D9A7C3E5F1B6D8A2C4E7F9B1D3A5C6E8
jwt.secret=ConnectHubSecretKeyForJWTGenerationAndValidation
jwt.expiration=86400000